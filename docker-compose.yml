# version removed for Compose v2

services:
  video:
    build:
      context: ./modules/video
    container_name: video
    ports:
      - "18116:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - product_loop

  tts:
    build:
      context: ./modules/tts
    container_name: tts
    ports:
      - "18117:8000"

  ugc:
    build:
      context: ./modules/ugc
    container_name: ugc
    ports:
      - "18118:8000"

  recipe:
    build:
      context: ./modules/recipe
    container_name: recipe
    ports:
      - "18119:8000"

  analysis:
    build:
      context: ./modules/analysis
    container_name: analysis
    ports:
      - "18120:8000"

  auto_prompt:
    build:
      context: ./modules/auto_prompt
    container_name: auto_prompt
    ports:
      - "18121:8000"

  automation:
    build:
      context: ./modules/automation
    container_name: automation
    ports:
      - "18122:8000"
    depends_on:
      - video
      - tts
      - ugc
      - recipe
      - analysis
      - auto_prompt
      - product_loop
      - wave2lip
      - jwt_gateway

  product_loop:
    build:
      context: ./modules/product_loop
    container_name: product_loop
    ports:
      - "18123:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db

  image:
    build:
      context: ./modules/image
    container_name: image
    ports:
      - "18124:8000"

  wave2lip:
    build:
      context: ./modules/wave2lip
    container_name: wave2lip
    ports:
      - "18115:8000"
    # Assumes binary is bundled in the image

  jwt_gateway:
    build:
      context: ./modules/jwt_gateway
    container_name: jwt_gateway
    ports:
      - "18125:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - TOKEN_EXP_SECONDS=${TOKEN_EXP_SECONDS}

  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  gateway:
    build:
      context: ./tiktok-ugc-studio
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      - VIDEO_SERVICE_URL=http://video:8000
      - TTS_SERVICE_URL=http://tts:8000
      - UGC_SERVICE_URL=http://ugc:8000
      - RECIPE_SERVICE_URL=http://recipe:8000
      - ANALYSIS_SERVICE_URL=http://analysis:8000
      - AUTOPROMPT_SERVICE_URL=http://auto_prompt:8000
      - AUTOMATION_SERVICE_URL=http://automation:8000
      - PRODUCTLOOP_SERVICE_URL=http://product_loop:8000
      - IMAGE_SERVICE_URL=http://image:8000
    depends_on:
      - video
      - tts
      - ugc
      - recipe
      - analysis
      - auto_prompt
      - automation
      - product_loop
      - image
      - jwt_gateway
      - db

  backend:
    build:
      context: ./backend
    container_name: backend
    network_mode: "host"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "13000:80"
    environment:
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8104:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway


volumes:
  db_data:
    driver: local
