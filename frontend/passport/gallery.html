<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gallery — Passport Photo Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:#f8fafc;min-height:100vh;color:#0f172a}
.hdr{padding:12px 16px 0;max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:8px}
.hdr h1{font-size:1.1rem;font-weight:800;white-space:nowrap;flex:1;min-width:0}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:100;padding:6px 0 env(safe-area-inset-bottom,8px);box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;text-decoration:none;color:#94a3b8;font-size:.6rem;font-weight:500;transition:.2s;-webkit-tap-highlight-color:transparent}
.bnav a .bi{font-size:1.2rem;line-height:1}
.bnav a:hover{color:#6366f1}
.bnav a.active{color:#6366f1;font-weight:700}
.page{max-width:1200px;margin:0 auto;padding:0 16px 60px}
.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 16px;flex:1;min-width:120px;text-align:center}
.stat .v{font-size:1.2rem;font-weight:800;color:#6366f1}
.stat .l{font-size:.65rem;color:#94a3b8;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;transition:.2s;cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08);border-color:#6366f1}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#f1f5f9}
.card .info{padding:10px 12px}
.card .id{font-size:.68rem;font-weight:600;color:#6366f1;word-break:break-all}
.card .meta{font-size:.6rem;color:#94a3b8;margin-top:3px}
.card .actions{display:flex;gap:4px;padding:0 12px 10px}
.btn{padding:5px 10px;border:none;border-radius:6px;font-size:.62rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.btn.dl{background:#10b981;color:#fff}
.btn.print{background:#6366f1;color:#fff}
.btn.del{background:#fee2e2;color:#ef4444}
.btn:hover{filter:brightness(1.1)}
.empty{text-align:center;padding:60px 16px;color:#94a3b8}
.loading{text-align:center;padding:40px;color:#94a3b8}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;justify-content:center;align-items:center;padding:20px}
.modal.show{display:flex}
.modal img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px}
.modal .close{position:fixed;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal .dlbtn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 24px;background:#10b981;color:#fff;border:none;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#0f172a;color:#fff;border-radius:20px;padding:9px 18px;z-index:999;font-size:.75rem;font-weight:500;transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}.card .info{padding:8px}.card .id{font-size:.6rem}}
</style>
</head>
<body>
<div class="hdr"><h1>📸 Gallery</h1></div>
<div class="page">
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid">
    <div class="loading">Loading...</div>
  </div>
</div>
<div class="modal" id="modal">
  <button class="close" onclick="closeModal()">✕</button>
  <img id="modalImg" src="">
  <a class="dlbtn" id="modalDl" href="" download>💾 Download</a>
</div>
<div class="toast" id="toast"></div>

<script>
var API='/api/passport';
var allPhotos=[];

async function loadGallery(){
  try{
    var r=await fetch(API+'/gallery?limit=200');
    var d=await r.json();
    if(!d.ok)throw new Error(d.detail||'Error');
    allPhotos=d.photos||[];
    renderStats(d.total);
    renderGrid(allPhotos);
  }catch(e){
    document.getElementById('grid').innerHTML='<div class="empty">Error loading gallery</div>';
    console.error(e);
  }
}

function renderStats(total){
  var el=document.getElementById('stats');
  var now=Date.now()/1000;
  var today=allPhotos.filter(p=>now-p.created<86400).length;
  var thisWeek=allPhotos.filter(p=>now-p.created<604800).length;
  el.innerHTML='<div class="stat"><div class="v">'+total+'</div><div class="l">Total Photos</div></div>'
    +'<div class="stat"><div class="v">'+today+'</div><div class="l">Today</div></div>'
    +'<div class="stat"><div class="v">'+thisWeek+'</div><div class="l">This Week</div></div>';
}

function renderGrid(photos){
  var el=document.getElementById('grid');
  if(!photos.length){el.innerHTML='<div class="empty"><div style="font-size:2rem;margin-bottom:8px">📷</div>No photos yet</div>';return}
  var h='';
  for(var i=0;i<photos.length;i++){
    var p=photos[i];
    var date=new Date(p.created*1000);
    var ds=date.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'});
    h+='<div class="card" onclick="openModal(\''+p.session_id+'\',\''+p.url+'\')">';
    h+='<img src="'+p.url+'" loading="lazy" alt="">';
    h+='<div class="info"><div class="id">'+p.session_id+'</div>';
    h+='<div class="meta">'+ds+' · '+p.size_kb+' KB</div></div>';
    h+='<div class="actions">';
    h+='<a class="btn dl" href="'+p.url+'" download onclick="event.stopPropagation()">⬇ Save</a>';
    if(p.print_url)h+='<a class="btn print" href="'+p.print_url+'" download onclick="event.stopPropagation()">🖨 Print</a>';
    h+='<button class="btn del" onclick="event.stopPropagation();delPhoto(\''+p.session_id+'\')">🗑</button>';
    h+='</div></div>';
  }
  el.innerHTML=h;
}

function openModal(sid,url){
  document.getElementById('modalImg').src=url;
  document.getElementById('modalDl').href=url;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});

async function delPhoto(sid){
  if(!confirm('Delete this photo?'))return;
  try{
    var r=await fetch(API+'/gallery/'+sid,{method:'DELETE'});
    var d=await r.json();
    if(d.ok){toast('Deleted');loadGallery()}else toast('Error','err');
  }catch(e){toast('Error','err')}
}

function toast(m,t){var e=document.getElementById('toast');e.className='toast show '+(t||'');e.textContent=m;setTimeout(function(){e.className='toast'},3000)}

loadGallery();
</script>
<div class="bnav"><a href="/"><span class="bi">&#x1F3E0;</span>Home</a><a href="/gallery.html" class="active"><span class="bi">&#x1F4F8;</span>Gallery</a><a href="/print.html"><span class="bi">&#x1F5A8;</span>Print</a></div>
</body>
</html>
