<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gallery — Passport Photo Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;width:100%}
body{font-family:'Inter',-apple-system,sans-serif;background:#0f172a;min-height:100vh;color:#e2e8f0;overflow-x:hidden;width:100%}
/* ── Top Header (same as Home) ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(15,23,42,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);padding:8px 16px}
.hdr-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hdr-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(99,102,241,.4)}
.hdr-logo svg{width:20px;height:20px;stroke:#fff;stroke-width:2;fill:none}
.hdr-txt{flex:1;min-width:0}
.hdr-txt h1{font-size:.95rem;font-weight:800;color:#fff;margin:0;line-height:1.2;white-space:nowrap}
.hdr-txt small{font-size:.6rem;color:rgba(255,255,255,.6);font-weight:500;display:block}
.hdr-badge{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:.6rem;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
/* ── Page ── */
.page{max-width:1100px;width:100%;margin:0 auto;padding:76px 16px 80px}
.page-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.page-h h2{font-size:1.05rem;font-weight:800;color:#fff;flex:1;min-width:0}
.page-h .count{background:rgba(255,255,255,.1);color:#a5b4fc;font-size:.65rem;font-weight:700;padding:5px 12px;border-radius:20px;white-space:nowrap}
/* ── Grid ── */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
/* ── Card (light like Home) ── */
.card{background:#fff;border:1px solid rgba(226,232,240,.9);border-radius:16px;overflow:hidden;transition:all .25s;cursor:pointer;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.card:hover{transform:translateY(-4px);border-color:#6366f1;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#f1f5f9;transition:transform .3s}
.card:hover img{transform:scale(1.03)}
.card .info{padding:10px 12px}
.card .id{font-size:.68rem;font-weight:700;color:#6366f1;word-break:break-all;font-family:monospace}
.card .meta{font-size:.6rem;color:#94a3b8;margin-top:3px}
.card .actions{display:flex;gap:6px;padding:0 12px 12px}
.btn{padding:6px 8px;border:none;border-radius:8px;font-size:.62rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px;flex:1;justify-content:center;transition:.2s;white-space:nowrap}
.btn.dl{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.btn.trans{background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:#fff}
.btn.print{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.btn.del{background:rgba(239,68,68,.15);color:#f87171;flex:0 0 auto;padding:6px 10px}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
/* Selection (light card) */
.card .sel-check{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;border:2px solid #cbd5e1;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;transition:.2s;font-size:12px;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card .sel-check:hover{border-color:#818cf8}
.card .sel-check.checked{background:#6366f1;border-color:#6366f1;color:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.25)}
/* Empty / Loading */
.empty{text-align:center;padding:60px 16px;color:#64748b}
.empty .ic{font-size:3rem;margin-bottom:12px;opacity:.5}
.loading{text-align:center;padding:60px 16px;color:#64748b}
.sp{width:32px;height:32px;border:3px solid rgba(255,255,255,.15);border-top-color:#818cf8;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
/* ── Modal ── */
.modal{display:none;position:fixed;inset:0;background:rgba(2,6,23,.9);z-index:1000;justify-content:center;align-items:center;padding:20px}
.modal.show{display:flex}
.modal img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .close{position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal .close:hover{background:rgba(255,255,255,.25)}
.modal .dlbtn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 28px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;border-radius:12px;font-size:.85rem;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 8px 24px rgba(16,185,129,.3)}
.modal .dlbtn:hover{filter:brightness(1.1)}
/* ── Batch Bar ── */
.batch-bar{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:700px;background:rgba(15,23,42,.95);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;z-index:99;box-shadow:0 12px 40px rgba(0,0,0,.5);gap:10px;flex-wrap:wrap}
.batch-bar span{font-size:.78rem;font-weight:700;color:#a5b4fc}
.batch-actions{display:flex;gap:6px;flex-wrap:wrap}
.batch-bar .btn{padding:8px 12px;border:none;border-radius:10px;font-size:.68rem;font-weight:700;cursor:pointer;white-space:nowrap}
.batch-print{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.batch-trans{background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:#fff}
.batch-dl{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.batch-del{background:rgba(239,68,68,.2);color:#f87171}
.batch-cancel{background:rgba(255,255,255,.1);color:#cbd5e1}
/* ── Toast ── */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);background:#fff;color:#0f172a;border-radius:20px;padding:10px 20px;z-index:999;font-size:.78rem;font-weight:600;transition:transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:#ef4444;color:#fff}
/* ── Bottom Nav (same as Home) ── */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,.92);backdrop-filter:blur(12px);display:flex;z-index:300;padding:4px 0 max(4px,env(safe-area-inset-bottom,4px));height:56px}
.bnav::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.45) 18%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.45) 82%,transparent 100%);pointer-events:none;z-index:1}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#94a3b8;font-size:.6rem;font-weight:600;transition:.2s;-webkit-tap-highlight-color:transparent}
.bnav a svg{width:20px;height:20px;stroke-width:1.8;fill:none;stroke:currentColor}
.bnav a:hover{color:#a5b4fc}
.bnav a.active{color:#818cf8}
</style>
</head>
<body>
<div class="hdr"><div class="hdr-in">
  <div class="hdr-logo"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M7 20v-1a5 5 0 0110 0v1"/></svg></div>
  <div class="hdr-txt"><h1>Passport Photo Studio</h1><small>AI-powered ID photos in seconds</small></div>
  <div class="hdr-badge">📸 64</div>
</div></div>
<div class="page">
  <div class="page-h">
    <h2>📸 Gallery</h2>
    <span class="count" id="countText">0 photos</span>
  </div>
  <div class="grid" id="grid">
    <div class="loading"><div class="sp"></div>Loading...</div>
  </div>
</div>
<div class="batch-bar" id="batchBar" style="display:none">
  <span id="batchCount">0 selected</span>
  <div class="batch-actions">
    <button class="btn batch-trans" onclick="batchTransparent()">💎 Transparent</button>
    <button class="btn batch-print" onclick="batchPrint()">🖨 Print</button>
    <button class="btn batch-dl" onclick="batchDownload()">💾 Download</button>
    <button class="btn batch-del" onclick="batchDelete()">🗑 Delete</button>
    <button class="btn batch-cancel" onclick="clearSelection()">✕</button>
  </div>
</div>
<div class="modal" id="modal">
  <button class="close" onclick="closeModal()">✕</button>
  <img id="modalImg" src="">
  <a class="dlbtn" id="modalDl" href="" download>💾 Download</a>
</div>
<div class="toast" id="toast"></div>

<script>
var API='/api/passport';
var allPhotos=[];
var selected=new Set();

async function loadGallery(){
  try{
    var r=await fetch(API+'/gallery?limit=200');
    var d=await r.json();
    if(!d.ok)throw new Error(d.detail||'Error');
    allPhotos=d.photos||[];
    document.querySelector('.hdr-badge').textContent='📸 '+d.total;
    renderStats(d.total);
    renderGrid(allPhotos);
  }catch(e){
    document.getElementById('grid').innerHTML='<div class="empty"><div class="ic">📷</div>Error loading gallery</div>';
    console.error(e);
  }
}

function renderStats(total){
  document.getElementById('countText').textContent=total+' photos';
}

function renderGrid(photos){
  var el=document.getElementById('grid');
  if(!photos.length){el.innerHTML='<div class="empty"><div class="ic">📷</div>No photos yet<br><small style="font-size:.7rem;margin-top:6px">Generate your first passport photo!</small></div>';return}
  var h='';
  for(var i=0;i<photos.length;i++){
    var p=photos[i];
    var date=new Date(p.created*1000);
    var ds=date.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'});
    var chk=selected.has(p.session_id)?'checked':'';
    h+='<div class="card" data-sid="'+p.session_id+'">';
    h+='<div class="sel-check '+chk+'" onclick="event.stopPropagation();toggleSelect(this,\''+p.session_id+'\')">'+(chk?'✓':'')+'</div>';
    h+='<img src="'+p.url+'" loading="lazy" alt="" onclick="openModal(\''+p.session_id+'\',\''+p.url+'\')">';
    h+='<div class="info"><div class="id">'+p.session_id+'</div>';
    h+='<div class="meta">'+ds+' · '+p.size_kb+' KB</div></div>';
    h+='<div class="actions">';
    h+='<a class="btn dl" href="'+p.url+'" download onclick="event.stopPropagation()">⬇ Save</a>';
    if(p.transparent_url)h+='<a class="btn trans" href="'+p.transparent_url+'" download onclick="event.stopPropagation()">💎 Transparent</a>';
    if(p.print_url)h+='<a class="btn print" href="'+p.print_url+'" download onclick="event.stopPropagation()">🖨 Print</a>';
    h+='<button class="btn del" onclick="event.stopPropagation();delPhoto(\''+p.session_id+'\')">🗑</button>';
    h+='</div></div>';
  }
  el.innerHTML=h;
}

function toggleSelect(el,sid){
  if(selected.has(sid)){selected.delete(sid);el.classList.remove('checked');el.innerHTML=''}
  else{selected.add(sid);el.classList.add('checked');el.innerHTML='✓'}
  updateBatchBar();
}

function updateBatchBar(){
  var bar=document.getElementById('batchBar');
  if(selected.size>0){bar.style.display='';document.getElementById('batchCount').textContent=selected.size+' selected'}
  else bar.style.display='none';
}

function clearSelection(){selected.clear();document.querySelectorAll('.sel-check').forEach(function(c){c.classList.remove('checked');c.innerHTML=''});updateBatchBar()}

function batchPrint(){
  if(!selected.size)return;
  var sids=Array.from(selected).join(',');
  window.location.href='/print.html?session_ids='+sids;
}

function batchDownload(){
  if(!selected.size)return;
  allPhotos.forEach(function(p){
    if(selected.has(p.session_id)){
      var a=document.createElement('a');a.href=p.url;a.download=p.session_id+'_passport.jpg';a.click();
    }
  });
  toast('Downloading '+selected.size+' photos');
}

function batchTransparent(){
  if(!selected.size)return;
  var found=0,missing=0;
  allPhotos.forEach(function(p){
    if(selected.has(p.session_id)){
      if(p.transparent_url){
        var a=document.createElement('a');
        a.href=p.transparent_url;
        a.download=p.session_id+'_transparent.png';
        a.click();
        found++;
      }else{
        missing++;
      }
    }
  });
  if(missing&&!found){toast('No transparent files — apply Cut BG first','err');return}
  toast('Downloading '+found+' transparent PNG'+(missing?' ('+missing+' missing)':''));
}

async function batchDelete(){
  if(!selected.size)return;
  if(!confirm('Delete '+selected.size+' photos?'))return;
  var ok=0,fail=0;
  for(var sid of selected){
    try{var r=await fetch(API+'/gallery/'+sid,{method:'DELETE'});var d=await r.json();if(d.ok)ok++;else fail++}catch(e){fail++}
  }
  selected.clear();updateBatchBar();toast(ok+' deleted'+(fail?' ('+fail+' failed)':''));loadGallery();
}

function openModal(sid,url){
  document.getElementById('modalImg').src=url;
  document.getElementById('modalDl').href=url;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});

async function delPhoto(sid){
  if(!confirm('Delete this photo?'))return;
  try{
    var r=await fetch(API+'/gallery/'+sid,{method:'DELETE'});
    var d=await r.json();
    if(d.ok){toast('Deleted');loadGallery()}else toast('Error','err');
  }catch(e){toast('Error','err')}
}

function toast(m,t){var e=document.getElementById('toast');e.className='toast show '+(t||'');e.textContent=m;setTimeout(function(){e.className='toast'},3000)}

loadGallery();
</script>
<div class="bnav"><a href="/"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>Home</a><a href="/gallery.html" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Gallery</a><a href="/print.html"><svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print</a></div>
</body>
</html>
