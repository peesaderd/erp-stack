<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gallery — Passport Photo Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:#374151;min-height:100vh;color:#0f172a}
.logo-bar{background:#3b82f6;padding:10px 16px;position:fixed;top:0;left:0;right:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.logo-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:22px;height:22px;stroke:#fff;stroke-width:2;fill:none}
.logo-text{flex:1}
.logo-text h1{font-size:1rem;font-weight:800;color:#fff;margin:0;line-height:1.2}
.logo-text small{font-size:.6rem;color:rgba(255,255,255,.7);font-weight:500}
.logo-badge{background:rgba(255,255,255,.2);color:#fff;font-size:.58rem;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;backdrop-filter:blur(4px)}
.hdr{padding:14px 16px 16px;max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:8px}
.hdr h2{font-size:.85rem;font-weight:700;color:#334155;white-space:nowrap;flex:1;min-width:0}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:100;padding:4px 0 max(4px,env(safe-area-inset-bottom,4px));box-shadow:0 -2px 10px rgba(0,0,0,.06);height:52px}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;text-decoration:none;color:#94a3b8;font-size:.58rem;font-weight:500;transition:.2s;-webkit-tap-highlight-color:transparent}
.bnav a svg{width:20px;height:20px;stroke-width:1.8;fill:none;stroke:currentColor;flex-shrink:0}
.bnav a:hover{color:#6366f1}
.bnav a.active{color:#6366f1;font-weight:700}
.page{max-width:1200px;margin:0 auto;padding:68px 16px 60px}
.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 16px;flex:1;min-width:120px;text-align:center}
.stat .v{font-size:1.2rem;font-weight:800;color:#6366f1}
.stat .l{font-size:.65rem;color:#94a3b8;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.8);border-radius:12px;overflow:hidden;transition:.2s;cursor:pointer;backdrop-filter:blur(8px)}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08);border-color:#6366f1}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#f1f5f9}
.card .info{padding:10px 12px}
.card .id{font-size:.68rem;font-weight:600;color:#6366f1;word-break:break-all}
.card .meta{font-size:.6rem;color:#94a3b8;margin-top:3px}
.card .actions{display:flex;gap:4px;padding:0 12px 10px}
.btn{padding:5px 10px;border:none;border-radius:6px;font-size:.62rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.btn.dl{background:#10b981;color:#fff}
.btn.print{background:#6366f1;color:#fff}
.btn.del{background:#fee2e2;color:#ef4444}
.btn:hover{filter:brightness(1.1)}
.empty{text-align:center;padding:60px 16px;color:#94a3b8}
.loading{text-align:center;padding:40px;color:#94a3b8}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;justify-content:center;align-items:center;padding:20px}
.modal.show{display:flex}
.modal img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px}
.modal .close{position:fixed;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal .dlbtn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 24px;background:#10b981;color:#fff;border:none;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#0f172a;color:#fff;border-radius:20px;padding:9px 18px;z-index:999;font-size:.75rem;font-weight:500;transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}.card .info{padding:8px}.card .id{font-size:.6rem}.logo-text small{display:none}.logo-badge{font-size:.5rem;padding:3px 8px}}
.batch-bar{position:fixed;bottom:52px;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:99;box-shadow:0 -4px 12px rgba(0,0,0,.08)}
.batch-bar span{font-size:.75rem;font-weight:600;color:#6366f1}
.batch-actions{display:flex;gap:6px}
.batch-bar .btn{padding:7px 12px;border:none;border-radius:8px;font-size:.68rem;font-weight:600;cursor:pointer}
.batch-print{background:#6366f1;color:#fff}
.batch-dl{background:#10b981;color:#fff}
.batch-del{background:#fee2e2;color:#ef4444}
.batch-cancel{background:#f1f5f9;color:#64748b}
.card{position:relative}
.card .sel-check{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:2px solid #e2e8f0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;transition:.2s}
.card .sel-check:hover{border-color:#6366f1}
.card .sel-check.checked{background:#6366f1;border-color:#6366f1;color:#fff;font-size:11px}
</style>
</head>
<body>
<div class="logo-bar"><div class="logo-inner">
  <div class="logo-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M7 20v-1a5 5 0 0110 0v1"/></svg></div>
  <div class="logo-text"><h1>Passport Photo Studio</h1><small>AI-powered ID photos in seconds</small></div>
  <div class="logo-badge">📸 Gallery</div>
</div></div>
<div class="hdr"><h2>📸 Gallery</h2></div>
<div class="page">
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid">
    <div class="loading">Loading...</div>
  </div>
  <div class="batch-bar" id="batchBar" style="display:none">
    <span id="batchCount">0 selected</span>
    <div class="batch-actions">
      <button class="btn batch-print" onclick="batchPrint()">🖨 Print Selected</button>
      <button class="btn batch-dl" onclick="batchDownload()">💾 Download All</button>
      <button class="btn batch-del" onclick="batchDelete()">🗑 Delete</button>
      <button class="btn batch-cancel" onclick="clearSelection()">✕ Cancel</button>
    </div>
  </div>
</div>
<div class="modal" id="modal">
  <button class="close" onclick="closeModal()">✕</button>
  <img id="modalImg" src="">
  <a class="dlbtn" id="modalDl" href="" download>💾 Download</a>
</div>
<div class="toast" id="toast"></div>

<script>
var API='/api/passport';
var allPhotos=[];

async function loadGallery(){
  try{
    var r=await fetch(API+'/gallery?limit=200');
    var d=await r.json();
    if(!d.ok)throw new Error(d.detail||'Error');
    allPhotos=d.photos||[];
    renderStats(d.total);
    renderGrid(allPhotos);
  }catch(e){
    document.getElementById('grid').innerHTML='<div class="empty">Error loading gallery</div>';
    console.error(e);
  }
}

function renderStats(total){
  var el=document.getElementById('stats');
  var now=Date.now()/1000;
  var today=allPhotos.filter(p=>now-p.created<86400).length;
  var thisWeek=allPhotos.filter(p=>now-p.created<604800).length;
  el.innerHTML='<div class="stat"><div class="v">'+total+'</div><div class="l">Total Photos</div></div>'
    +'<div class="stat"><div class="v">'+today+'</div><div class="l">Today</div></div>'
    +'<div class="stat"><div class="v">'+thisWeek+'</div><div class="l">This Week</div></div>';
}

var selected=new Set();

function renderGrid(photos){
  var el=document.getElementById('grid');
  if(!photos.length){el.innerHTML='<div class="empty"><div style="font-size:2rem;margin-bottom:8px">📷</div>No photos yet</div>';return}
  var h='';
  for(var i=0;i<photos.length;i++){
    var p=photos[i];
    var date=new Date(p.created*1000);
    var ds=date.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'});
    var chk=selected.has(p.session_id)?'checked':'';
    h+='<div class="card" data-sid="'+p.session_id+'">';
    h+='<div class="sel-check '+chk+'" onclick="event.stopPropagation();toggleSelect(this,\''+p.session_id+'\')">'+(chk?'✓':'')+'</div>';
    h+='<img src="'+p.url+'" loading="lazy" alt="" onclick="openModal(\''+p.session_id+'\',\''+p.url+'\')">';
    h+='<div class="info"><div class="id">'+p.session_id+'</div>';
    h+='<div class="meta">'+ds+' · '+p.size_kb+' KB</div></div>';
    h+='<div class="actions">';
    h+='<a class="btn dl" href="'+p.url+'" download onclick="event.stopPropagation()">⬇ Save</a>';
    if(p.print_url)h+='<a class="btn print" href="'+p.print_url+'" download onclick="event.stopPropagation()">🖨 Print</a>';
    h+='<button class="btn del" onclick="event.stopPropagation();delPhoto(\''+p.session_id+'\')">🗑</button>';
    h+='</div></div>';
  }
  el.innerHTML=h;
}

function toggleCheck(){
  document.querySelectorAll('.sel-check').forEach(function(c){c.classList.add('show-check')});
}

function toggleSelect(el,sid){
  if(selected.has(sid)){selected.delete(sid);el.classList.remove('checked');el.innerHTML=''}
  else{selected.add(sid);el.classList.add('checked');el.innerHTML='✓'}
  updateBatchBar();
}

function updateBatchBar(){
  var bar=document.getElementById('batchBar');
  if(selected.size>0){bar.style.display='';document.getElementById('batchCount').textContent=selected.size+' selected'}
  else bar.style.display='none';
}

function clearSelection(){selected.clear();document.querySelectorAll('.sel-check').forEach(function(c){c.classList.remove('checked');c.innerHTML=''});updateBatchBar()}

function batchPrint(){
  if(!selected.size)return;
  var sids=Array.from(selected).join(',');
  window.location.href='/print.html?session_ids='+sids;
}

function batchDownload(){
  if(!selected.size)return;
  allPhotos.forEach(function(p){
    if(selected.has(p.session_id)){
      var a=document.createElement('a');a.href=p.url;a.download=p.session_id+'_passport.jpg';a.click();
    }
  });
  toast('Downloading '+selected.size+' photos');
}

async function batchDelete(){
  if(!selected.size)return;
  if(!confirm('Delete '+selected.size+' photos?'))return;
  var ok=0,fail=0;
  for(var sid of selected){
    try{var r=await fetch(API+'/gallery/'+sid,{method:'DELETE'});var d=await r.json();if(d.ok)ok++;else fail++}catch(e){fail++}
  }
  selected.clear();updateBatchBar();toast(ok+' deleted'+(fail?' ('+fail+' failed)':''));loadGallery();
}

function openModal(sid,url){
  document.getElementById('modalImg').src=url;
  document.getElementById('modalDl').href=url;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});

async function delPhoto(sid){
  if(!confirm('Delete this photo?'))return;
  try{
    var r=await fetch(API+'/gallery/'+sid,{method:'DELETE'});
    var d=await r.json();
    if(d.ok){toast('Deleted');loadGallery()}else toast('Error','err');
  }catch(e){toast('Error','err')}
}

function toast(m,t){var e=document.getElementById('toast');e.className='toast show '+(t||'');e.textContent=m;setTimeout(function(){e.className='toast'},3000)}

loadGallery();
</script>
<div class="bnav"><a href="/"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>Home</a><a href="/gallery.html" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Gallery</a><a href="/print.html"><svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print</a></div>
</body>
</html>
