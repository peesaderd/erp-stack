<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Passport Photo Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:'Inter',-apple-system,sans-serif;background:#f8fafc;min-height:100vh;color:#0f172a}
.hdr{padding:20px 16px 12px;max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hdr h1{font-size:1.3rem;font-weight:800;flex:1}
.hdr .price{font-size:.7rem;color:#6366f1;font-weight:600;background:#eef2ff;padding:5px 10px;border-radius:20px;white-space:nowrap}
.page{max-width:960px;width:100%;margin:0 auto;padding:0 16px 60px;overflow-x:hidden}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.row>*{min-width:0}
.card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);min-width:0}
.card-h{padding:12px 16px;border-bottom:1px solid #e2e8f0;font-size:.78rem;font-weight:700}
.card-b{padding:16px}
.drop{border:2px dashed #e2e8f0;border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;transition:.2s;background:#f1f5f9}
.drop:hover{border-color:#6366f1;background:#eef2ff}
.drop.has{border-style:solid;border-color:#6366f1;padding:10px;display:flex;align-items:center;gap:12px;text-align:left}
.drop img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0}
.drop .info{flex:1}.drop .nm{font-size:.75rem;font-weight:600;word-break:break-all}.drop .mt{font-size:.65rem;color:#64748b}
.drop input{display:none}
.drop .emp{font-size:.8rem;color:#64748b}.drop .emp .ic{font-size:28px;margin-bottom:6px;opacity:.5}
.gbadge{display:inline-flex;align-items:center;gap:3px;margin-top:3px;padding:2px 7px;border-radius:10px;font-size:.6rem;font-weight:600;background:#eef2ff;color:#6366f1}
.bbadge{display:inline-flex;align-items:center;gap:3px;margin-top:3px;padding:2px 7px;border-radius:10px;font-size:.6rem;font-weight:600;background:#dcfce7;color:#16a34a}
.previews{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.previews div{aspect-ratio:3/4;border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.previews img{width:100%;height:100%;object-fit:cover}
.csel{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.78rem;background:#fff;color:#0f172a;outline:none;cursor:pointer}
.csel:focus{border-color:#6366f1}
.crow{display:flex;gap:5px;align-items:center;margin-top:6px}
.crow input{flex:1;padding:7px 8px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.72rem;outline:none;text-align:center}
.crow span{color:#94a3b8;font-weight:600}
.crow button{padding:7px 12px;border:none;border-radius:8px;font-size:.68rem;font-weight:600;cursor:pointer;background:#6366f1;color:#fff}
.caro{position:relative}
.caro-list{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px}
.caro-list::-webkit-scrollbar{display:none}
.citem{flex:0 0 82px;cursor:pointer;border:2px solid #e2e8f0;border-radius:8px;overflow:hidden;transition:.2s;background:#fff;position:relative}
.citem:hover{border-color:#6366f1;transform:translateY(-1px)}
.citem.on{border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.15)}
.citem img{width:100%;height:90px;object-fit:cover;display:block;background:#f1f5f9}
.citem .lb{text-align:center;padding:5px 2px;font-size:.58rem;font-weight:600;color:#64748b}
.citem.on .lb{color:#6366f1}
.citem .ck{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#6366f1;color:#fff;display:none;align-items:center;justify-content:center;font-size:8px;font-weight:700}
.citem.on .ck{display:flex}
.carro{position:absolute;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid #e2e8f0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#64748b;z-index:2}
.carro:hover{background:#6366f1;color:#fff;border-color:#6366f1}
.carro.L{left:-6px}.carro.R{right:-6px}
.bgrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bgd{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid #e2e8f0;transition:.2s;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bgd:hover{transform:scale(1.1)}.bgd.on{border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.15)}
.bgd.on::after{content:"\2713";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;color:#6366f1}
.bgd.cust{border-style:dashed;display:flex;align-items:center;justify-content:center;font-size:.9rem;color:#94a3b8}
.cwrap{position:relative;width:34px;height:34px}
.cwrap input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pf label{font-size:.6rem;color:#94a3b8;margin-bottom:2px;display:block;font-weight:500}
.pf select,.pf input{width:100%;padding:7px 8px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.72rem;background:#fff;color:#0f172a;outline:none}
.blade{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:.65rem;color:#64748b;cursor:pointer;user-select:none}
.blade input{accent-color:#6366f1;width:12px;height:12px}
.gen{width:100%;padding:13px;border:none;border-radius:10px;font-size:.88rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;margin-top:14px;box-shadow:0 4px 12px rgba(99,102,241,.15);transition:.2s}
.gen:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(99,102,241,.2)}
.gen:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.rimg{width:100%;max-height:400px;object-fit:contain;background:#f1f5f9}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #e2e8f0}
.rst{padding:8px 4px;text-align:center;border-right:1px solid #e2e8f0}
.rst:last-child{border-right:none}
.rst .v{font-size:.78rem;font-weight:700;color:#6366f1}
.rst .l{font-size:.52rem;color:#94a3b8;margin-top:1px}
.rbtns{display:flex;gap:5px;padding:12px}
.rbtn{flex:1;padding:9px;border:none;border-radius:8px;font-size:.72rem;font-weight:600;cursor:pointer;text-align:center}
.rbtn.p{background:#10b981;color:#fff}.rbtn.p:hover{filter:brightness(1.1)}
.rbtn.s{background:#f1f5f9;color:#0f172a;border:1px solid #e2e8f0}.rbtn.s:hover{border-color:#6366f1;color:#6366f1}
.blist{padding:0 12px 12px}
.bi{display:flex;align-items:center;gap:6px;padding:7px 8px;background:#f1f5f9;border-radius:6px;margin-bottom:4px;font-size:.68rem}
.bi .n{font-weight:700;color:#94a3b8;min-width:20px}.bi .inf{flex:1}
.bi .ok{font-size:.58rem;padding:2px 5px;border-radius:6px;font-weight:600;background:#dcfce7;color:#16a34a}
.bi a{color:#6366f1;text-decoration:none;font-weight:600;font-size:.65rem}
.ov{display:none;position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:998;justify-content:center;align-items:center;flex-direction:column;gap:12px;backdrop-filter:blur(8px)}
.ov.show{display:flex}
.sp{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ov .t{font-size:.82rem;color:#64748b;font-weight:500}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#0f172a;color:#fff;border-radius:20px;padding:9px 18px;z-index:999;font-size:.75rem;font-weight:500;transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}.toast.err{background:#ef4444}
.empty{text-align:center;padding:36px 16px;color:#94a3b8}
@media(max-width:768px){.row{grid-template-columns:1fr}.hdr{flex-direction:column;align-items:flex-start;gap:6px}.citem{width:70px}.citem img{height:78px}}
</style>
</head>
<body>
<div class="hdr"><h1>&#x1F4F8; Passport Photo Studio</h1><div class="price">&#x26A1; $0.004 / photo</div></div>
<div class="ov" id="ov"><div class="sp"></div><div class="t" id="ovt">Generating...</div></div>
<div class="toast" id="toast"></div>
<div class="page"><div class="row">
<div>
<div class="card"><div class="card-h">&#x1F4F7; Upload</div><div class="card-b">
<div class="drop" id="drop">
<div class="emp" id="emp"><div class="ic">&#x1F4F7;</div>Drag &amp; drop or click<br><small>JPG / PNG &#xB7; Up to 20 files</small></div>
<div class="filled" id="fil" style="display:none"><img id="pth" alt=""><div class="info"><div class="nm" id="fn"></div><div class="mt" id="fm"></div><div id="gb"></div><div id="bb" style="display:none"></div></div></div>
<input type="file" id="fi" accept="image/jpeg,image/png" multiple>
</div>
<div class="previews" id="pvg"></div>
</div></div>
<div class="card" style="margin-top:12px"><div class="card-h">&#x1F30D; Country</div><div class="card-b">
<select class="csel" id="cs"><option value="">Select Country</option></select>
<div class="crow"><input type="number" id="cw" placeholder="W mm" min="10" max="200"><span>&#xD7;</span><input type="number" id="ch" placeholder="H mm" min="10" max="200"><button id="cb">Custom</button></div>
</div></div>
<div class="card" style="margin-top:12px"><div class="card-h">&#x1F454; Clothing <span style="float:right;font-size:.58rem;background:#6366f1;color:#fff;padding:1px 5px;border-radius:8px" id="cc">0</span></div><div class="card-b" style="padding:10px 12px">
<div class="caro"><button class="carro L" id="cL">&#x25C0;</button><div class="caro-list" id="cl"></div><button class="carro R" id="cR">&#x25B6;</button></div>
</div></div>
<div class="card" style="margin-top:12px"><div class="card-h">&#x1F3A8; Background</div><div class="card-b"><div class="bgrow" id="bgr"></div></div></div>
<div class="card" style="margin-top:12px"><div class="card-h">&#x1F5A8; Print</div><div class="card-b">
<div class="pgrid">
<div class="pf"><label>Paper</label><select id="ps"><option value="4x6">4&#xD7;6"</option><option value="5x7">5&#xD7;7"</option><option value="a6">A6</option><option value="a4">A4</option></select></div>
<div class="pf"><label>Count</label><input type="number" id="pc" value="6" min="1" max="20"></div>
<div class="pf"><label>Border</label><select id="bt"><option value="guidelines">Cut lines</option><option value="none">None</option><option value="frame">Frame</option></select></div>
</div>
<label class="blade"><input type="checkbox" id="bm"> Blade mode</label>
</div></div>
<button class="gen" id="gbn" disabled>&#x2728; Generate</button>
</div>
<div>
<div class="card"><div class="card-h">&#x1F4CB; Result</div><div class="card-b">
<div class="empty" id="re"><div style="font-size:2.2rem;margin-bottom:10px;opacity:.4">&#x1F5BC;&#xFE0F;</div>Upload &amp; click Generate<br><small>Results appear here</small></div>
<div id="rc" style="display:none"><div style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.08);border:1px solid #e2e8f0">
<img class="rimg" id="ri" alt="">
<div class="rstats" id="rs"></div>
<div class="rbtns"><button class="rbtn p" id="dp">&#x1F4BE; Download</button><button class="rbtn s" id="dpr">&#x1F5A8; Print</button><button class="rbtn s" id="rr">&#x1F504; New</button></div>
<div id="psi" style="display:none;padding:0 12px 12px"><img id="pri" alt="" style="width:100%;border-radius:10px;background:#f1f5f9"></div>
<div class="blist" id="bl" style="display:none"></div>
</div></div>
</div></div>
</div>
</div></div>
<script>
var API='/api/passport';
var S={photo:null,photos:[],bulk:false,gender:'male',clothing:'white_shirt',bg:'light_blue',tpl:'us_passport',bgc:null,cw:null,ch:null,sid:null};
var CD={male:[],female:[]},BD=[],TD=[];
var FL={Thailand:'\u{1F1F9}\u{1F1ED}',Japan:'\u{1F1EF}\u{1F1F5}',China:'\u{1F1E8}\u{1F1F3}','South Korea':'\u{1F1F0}\u{1F1F7}','United States':'\u{1F1FA}\u{1F1F8}','United Kingdom':'\u{1F1EC}\u{1F1E7}','European Union':'\u{1F1EA}\u{1F1FA}',Canada:'\u{1F1E8}\u{1F1E6}',Australia:'\u{1F1E6}\u{1F1FA}',India:'\u{1F1EE}\u{1F1F3}',Singapore:'\u{1F1F8}\u{1F1EC}',Malaysia:'\u{1F1F2}\u{1F1FE}',Philippines:'\u{1F1F5}\u{1F1ED}',Indonesia:'\u{1F1EE}\u{1F1E9}',Vietnam:'\u{1F1FB}\u{1F1F3}',Cambodia:'\u{1F1F0}\u{1F1ED}',Laos:'\u{1F1F1}\u{1F1E6}',Myanmar:'\u{1F1F2}\u{1F1E2}','Hong Kong':'\u{1F1ED}\u{1F1F0}',France:'\u{1F1EB}\u{1F1F7}',Germany:'\u{1F1E9}\u{1F1EA}'};

function $(id){return document.getElementById(id)}

async function boot(){
  try{
    var m=await fetch(API+'/clothing?gender=male');var mj=await m.json();CD.male=mj.options||mj;
    var f=await fetch(API+'/clothing?gender=female');var fj=await f.json();CD.female=fj.options||fj;
    var b=await fetch(API+'/backgrounds');var bj=await b.json();BD=bj.options||bj;
    var t=await fetch(API+'/templates');var tj=await t.json();TD=tj.templates||tj;
  }catch(e){console.error('loadData error:',e)}
  renderCountry();
  renderClothes();
  renderBG();
  setupUI();
}

function renderCountry(){
  var h='<option value="">Select Country</option>';
  for(var i=0;i<TD.length;i++){
    var t=TD[i],f=FL[t.country]||'';
    h+='<option value="'+t.code+'"'+(t.code===S.tpl?' selected':'')+'>'+f+' '+t.name+' ('+t.width_mm+'\u00D7'+t.height_mm+'mm)</option>';
  }
  $('cs').innerHTML=h;
}

function renderClothes(){
  var d=S.gender==='male'?CD.male:CD.female;
  if(!d||!d.length){$('cl').innerHTML='<div style="padding:12px;color:#94a3b8;font-size:.72rem">No data</div>';$('cc').textContent='0';return;}
  $('cc').textContent=d.length;
  var h='';
  for(var i=0;i<d.length;i++){
    var c=d[i];
    h+='<div class="citem'+(c.key===S.clothing?' on':'')+'" data-k="'+c.key+'">';
    h+='<img src="/img/clothing/'+S.gender+'/'+c.key+'.png" loading="lazy" onerror="this.style.background=\'#f1f5f9\'">';
    h+='<div class="lb">'+c.name+'</div>';
    h+='<div class="ck">\u2713</div></div>';
  }
  $('cl').innerHTML=h;
  var items=$('cl').querySelectorAll('.citem');
  for(var j=0;j<items.length;j++){
    items[j].addEventListener('click',function(){
      S.clothing=this.dataset.k;
      var all=$('cl').querySelectorAll('.citem');
      for(var k=0;k<all.length;k++)all[k].classList.remove('on');
      this.classList.add('on');
    });
  }
}

function renderBG(){
  var h='';
  for(var i=0;i<BD.length;i++){
    var b=BD[i];
    h+='<div class="bgd'+(b.key===S.bg?' on':'')+'" style="background:'+(b.hex||'#ccc')+'" data-k="'+b.key+'" title="'+b.name+'"></div>';
  }
  h+='<div class="cwrap"><div class="bgd cust" title="Custom">+</div><input type="color" value="#C4DCFF" id="ccolor"></div>';
  $('bgr').innerHTML=h;
  var dots=$('bgr').querySelectorAll('.bgd:not(.cust)');
  for(var j=0;j<dots.length;j++){
    dots[j].addEventListener('click',function(){
      S.bg=this.dataset.k;S.bgc=null;
      var all=$('bgr').querySelectorAll('.bgd');
      for(var k=0;k<all.length;k++)all[k].classList.remove('on');
      this.classList.add('on');
    });
  }
  $('ccolor').addEventListener('input',function(e){
    S.bgc=e.target.value;S.bg='custom';
    var all=$('bgr').querySelectorAll('.bgd');
    for(var k=0;k<all.length;k++)all[k].classList.remove('on');
  });
}

function setupUI(){
  $('drop').addEventListener('click',function(e){if(e.target.tagName==='BUTTON')return;$('fi').click()});
  $('fi').addEventListener('change',function(e){handleFiles(e.target.files)});
  $('drop').addEventListener('dragover',function(e){e.preventDefault()});
  $('drop').addEventListener('drop',function(e){e.preventDefault();handleFiles(e.dataTransfer.files)});
  $('gbn').addEventListener('click',generate);
  $('dp').addEventListener('click',function(){dl('passport')});
  $('dpr').addEventListener('click',function(){dl('print')});
  $('rr').addEventListener('click',clearAll);
  $('cb').addEventListener('click',function(){
    var w=parseInt($('cw').value),ht=parseInt($('ch').value);
    if(w>0&&ht>0){S.cw=w;S.ch=ht;S.tpl='custom';$('cs').value='';toast(w+'\u00D7'+ht+'mm')}
  });
  $('cs').addEventListener('change',function(){S.tpl=this.value;S.cw=null;S.ch=null});
  $('cL').addEventListener('click',function(){$('cl').scrollBy({left:-100,behavior:'smooth'})});
  $('cR').addEventListener('click',function(){$('cl').scrollBy({left:100,behavior:'smooth'})});
}

function handleFiles(files){
  var a=[];for(var i=0;i<files.length;i++){if(files[i].type.startsWith('image/'))a.push(files[i])}
  if(!a.length)return;
  if(a.length===1){S.photo=a[0];S.photos=[a[0]];S.bulk=false}
  else{S.photos=a.slice(0,20);S.photo=a[0];S.bulk=true}
  showUpload();detectGender();$('gbn').disabled=false;
}

function showUpload(){
  var z=$('drop');
  if(!S.photo){z.classList.remove('has');$('emp').style.display='';$('fil').style.display='none';$('pvg').innerHTML='';return}
  z.classList.add('has');$('emp').style.display='none';$('fil').style.display='';
  $('pth').src=URL.createObjectURL(S.photo);$('fn').textContent=S.photo.name;
  $('fm').textContent=S.bulk?S.photos.length+' files':(S.photo.size/1024).toFixed(0)+' KB';
  $('bb').style.display=S.bulk?'inline-flex':'none';
  if(S.photos.length>1){
    var h='';for(var i=0;i<Math.min(8,S.photos.length);i++)h+='<div><img src="'+URL.createObjectURL(S.photos[i])+'"></div>';
    if(S.photos.length>8)h+='<div style="display:flex;align-items:center;justify-content:center;background:#f1f5f9;font-size:.6rem;color:#94a3b8">+'+(S.photos.length-8)+'</div>';
    $('pvg').innerHTML=h;
  }else $('pvg').innerHTML='';
}

function clearAll(){
  S.photo=null;S.photos=[];S.bulk=false;S.gender='male';S.clothing='white_shirt';S.sid=null;
  $('fi').value='';$('gb').innerHTML='';$('bb').style.display='none';$('gbn').disabled=true;
  showUpload();renderClothes();$('re').style.display='';$('rc').style.display='none';
}

async function detectGender(){
  if(!S.photo)return;
  try{
    var b=await toB64(S.photo);var fd=new FormData();fd.append('image_base64',b);
    var r=await fetch(API+'/detect-gender',{method:'POST',body:fd});var d=await r.json();
    if(d.ok&&d.gender){S.gender=d.gender;S.clothing=S.gender==='male'?'white_shirt':'white_blouse';
    $('gb').innerHTML='<span class="gbadge">'+(d.gender==='male'?'\u{1F468}':'\u{1F469}')+' '+d.gender+'</span>';
    renderClothes();}
  }catch(e){console.error(e)}
}

async function generate(){
  if(!S.photo)return;
  if(S.bulk&&S.photos.length>1)return genBulk();
  showOv('Generating...');
  try{
    var b=await toB64(S.photo);
    var body={image_base64:b,template_code:S.tpl,gender:S.gender,clothing:S.clothing,background:S.bg,strength:0.65};
    if(S.bgc)body.background_color=S.bgc;if(S.cw&&S.ch){body.custom_width=S.cw;body.custom_height=S.ch}
    var r=await fetch(API+'/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json();if(!d.ok)throw new Error(d.detail||'Error');
    S.sid=d.session_id;showResult(d);
  }catch(e){toast('Error: '+e.message,'err')}finally{hideOv()}
}

async function genBulk(){
  showOv('Generating '+S.photos.length+'...');
  try{
    var imgs=[];for(var i=0;i<S.photos.length;i++)imgs.push(await toB64(S.photos[i]));
    var body={images:imgs,template_code:S.tpl,gender:S.gender,clothing:S.clothing,background:S.bg,strength:0.65,
      print_size:$('ps').value,photo_count:parseInt($('pc').value)||6,border:$('bt').value,blade_mode:$('bm').checked};
    if(S.bgc)body.background_color=S.bgc;if(S.cw&&S.ch){body.custom_width=S.cw;body.custom_height=S.ch}
    var r=await fetch(API+'/bulk-generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json();if(!d.ok)throw new Error(d.detail||'Error');
    S.sid=d.results&&d.results[0]?d.results[0].session_id:null;showBulk(d);
  }catch(e){toast('Error: '+e.message,'err')}finally{hideOv()}
}

function showResult(d){
  $('re').style.display='none';$('rc').style.display='';
  $('rs').innerHTML='<div class="rst"><div class="v">'+(d.time_seconds||'?')+'s</div><div class="l">Time</div></div>'
    +'<div class="rst"><div class="v">'+d.dimensions.w+'\u00D7'+d.dimensions.h+'</div><div class="l">mm</div></div>'
    +'<div class="rst"><div class="v">'+(d.gender==='male'?'\u{1F468}':'\u{1F469}')+'</div><div class="l">Gender</div></div>'
    +'<div class="rst"><div class="v">$0.004</div><div class="l">Cost</div></div>';
  $('ri').src=API+'/download/'+d.session_id+'_passport.jpg?t='+Date.now();
  if(d.download_print){$('pri').src=API+'/download/'+d.session_id+'_print.jpg?t='+Date.now();$('psi').style.display=''}
  else $('psi').style.display='none';
  $('bl').style.display='none';toast('Done!');
}

function showBulk(d){
  $('re').style.display='none';$('rc').style.display='';
  $('rs').innerHTML='<div class="rst"><div class="v">'+d.time_seconds+'s</div><div class="l">Time</div></div>'
    +'<div class="rst"><div class="v">'+d.success+'/'+d.total+'</div><div class="l">OK</div></div>'
    +'<div class="rst"><div class="v">$'+(0.004*d.total).toFixed(3)+'</div><div class="l">Cost</div></div>'
    +'<div class="rst"><div class="v">'+d.total+'</div><div class="l">Photos</div></div>';
  if(d.results&&d.results[0]&&d.results[0].ok)$('ri').src=API+'/download/'+d.results[0].session_id+'_passport.jpg?t='+Date.now();
  var h='';for(var i=0;i<d.results.length;i++){
    var r=d.results[i];
    if(r.ok)h+='<div class="bi"><span class="n">#'+(r.index+1)+'</span><div class="inf">'+r.clothing+'</div><span class="ok">\u2713 '+r.time_seconds+'s</span><a href="'+API+'/download/'+r.session_id+'_passport.jpg" download>\u2B07</a></div>';
  }
  $('bl').innerHTML=h;$('bl').style.display='';$('psi').style.display='none';toast(d.success+'/'+d.total+' OK');
}

function toB64(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result.split(',')[1])};r.onerror=rej;r.readAsDataURL(f)})}
function dl(t){if(!S.sid)return;var a=document.createElement('a');a.href=API+'/download/'+S.sid+'_'+t+'.jpg';a.download='passport_'+t+'.jpg';a.click()}
function showOv(t){$('ovt').textContent=t;$('ov').classList.add('show')}
function hideOv(){$('ov').classList.remove('show')}
var tt;function toast(m,t){clearTimeout(tt);var e=$('toast');e.className='toast show '+(t||'');e.textContent=m;tt=setTimeout(function(){e.classList.remove('show')},3000)}

boot();
</script>
</body>
</html>
