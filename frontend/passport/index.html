<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Passport Photo Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{overflow-x:hidden;width:100%}body{font-family:'Inter',-apple-system,sans-serif;background:#0f172a;min-height:100vh;color:#0f172a;overflow-x:hidden;width:100%}
.hdr{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(15,23,42,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);padding:8px 16px}.hdr-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}.hdr-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(99,102,241,.4)}.hdr-logo svg{width:20px;height:20px;stroke:#fff;stroke-width:2;fill:none}.hdr-txt{flex:1;min-width:0}.hdr-txt h1{font-size:.95rem;font-weight:800;color:#fff;margin:0;line-height:1.2}.hdr-txt small{font-size:.6rem;color:rgba(255,255,255,.6);font-weight:500;display:block}.hdr-badge{background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:.6rem;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}

.page{max-width:500px;width:100%;margin:0 auto;padding:60px 16px 80px;overflow-x:hidden}
.section{margin-bottom:16px;animation:fadeIn .3s}.section.hidden{display:none}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:#fff;border-radius:16px;border:1px solid rgba(255,255,255,.06);overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:100%}

/* Upload */
.drop{border:2px dashed #cbd5e1;border-radius:16px;padding:52px 20px;text-align:center;cursor:pointer;transition:.2s;background:#f8fafc}.drop:hover{border-color:#6366f1;background:#eef2ff}.drop .ic{font-size:48px;margin-bottom:12px;opacity:.6}.drop h3{font-size:1rem;font-weight:700;color:#0f172a;margin-bottom:4px}.drop p{font-size:.72rem;color:#64748b;margin-bottom:16px}.drop input{display:none}.drop-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.drop-btns button{padding:10px 20px;border:none;border-radius:10px;font-size:.8rem;font-weight:600;cursor:pointer}
.btn-p{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3)}.btn-p:hover{transform:translateY(-1px)}.btn-c{background:#e2e8f0;color:#475569}.btn-c:hover{background:#cbd5e1}.gbadge{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:16px;font-size:.7rem;font-weight:600;background:#eef2ff;color:#6366f1}

/* Clothing */
.opt-sec{margin-bottom:14px;min-width:0;max-width:100%}.opt-h{display:flex;align-items:center;gap:8px;font-size:.75rem;font-weight:700;color:#0f172a;margin-bottom:8px}.opt-h .e{font-size:1rem}
.gender-tabs{display:flex;gap:6px;margin-bottom:10px}.gtab{flex:1;padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:8px;background:#f8fafc;cursor:pointer;font-size:.72rem;font-weight:600;color:#64748b;transition:.2s}.gtab.active{background:#6366f1;color:#fff;border-color:#6366f1}
.caro{position:relative;overflow:hidden;width:100%}.caro-list{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px}.caro-list::-webkit-scrollbar{display:none}.citem{flex:0 0 76px;min-width:0;cursor:pointer;border:2px solid #e2e8f0;border-radius:10px;overflow:hidden;transition:.2s;background:#fff;position:relative}.citem:hover{border-color:#6366f1;transform:translateY(-1px)}.citem.on{border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.15)}.citem img{width:100%;height:84px;object-fit:cover;display:block;background:#f1f5f9}.citem .lb{text-align:center;padding:5px 2px;font-size:.58rem;font-weight:600;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.citem.on .lb{color:#6366f1}.citem .ck{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#6366f1;color:#fff;display:none;align-items:center;justify-content:center;font-size:8px;font-weight:700}.citem.on .ck{display:flex}
.carro-btn{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid #e2e8f0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#64748b;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.1)}

/* Generate */
.gen-btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:.95rem;font-weight:800;cursor:pointer;transition:.2s;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.4);display:flex;align-items:center;justify-content:center;gap:10px}.gen-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,.5)}.gen-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}.gen-btn .ico{font-size:1.2rem}

/* Post-gen */
.sec-divider{height:1px;background:linear-gradient(90deg,transparent,#e2e8f0,transparent);margin:20px 0}
.preview-wrap{text-align:center;margin-bottom:16px;position:relative}
.preview-box{position:relative;max-width:280px;width:100%;aspect-ratio:1/1;margin:0 auto;overflow:hidden;border-radius:14px;border:2px solid #e2e8f0;background:#fff}.preview-img{width:100%;height:100%;object-fit:contain;border-radius:14px;display:block;position:relative;z-index:1;background:#fff}.preview-bg{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:14px;z-index:0;transition:background-color .2s}
.preview-bg{position:absolute;top:0;left:50%;transform:translateX(-50%);width:260px;height:260px;border-radius:14px;z-index:0;transition:background-color .2s}
.opt-tab{flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-size:.68rem;font-weight:700;color:#94a3b8;cursor:pointer;transition:.2s;white-space:nowrap}.opt-tab.active{background:#6366f1;color:#fff}.opt-pane{display:none}.opt-pane.act{display:block}.opt-pane.act{animation:fadeIn .25s}
.res-stats{display:flex;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}.rst{text-align:center;padding:8px 14px;background:#f8fafc;border-radius:10px;min-width:60px}.rst .v{font-size:.85rem;font-weight:700;color:#0f172a}.rst .l{font-size:.58rem;color:#94a3b8;margin-top:2px}
.res-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:center}.res-btns button{padding:10px 18px;border:none;border-radius:10px;font-size:.75rem;font-weight:600;cursor:pointer;transition:.2s}

/* BG Colors */
.bg-d{width:32px;height:32px;border-radius:50%;border:2px solid #e2e8f0;cursor:pointer;transition:.2s;display:inline-block}.bg-d:hover{border-color:#6366f1;transform:scale(1.1)}.bg-d.on{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.3)}

/* Crop */
.crop-opts{display:flex;gap:6px;flex-wrap:wrap}.crop-opt{padding:8px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:.72rem;font-weight:600;color:#64748b;cursor:pointer;background:#fff;transition:.2s}.crop-opt:hover{border-color:#6366f1}.crop-opt.active{background:#6366f1;color:#fff;border-color:#6366f1}

/* Size / Print */
.sz-p,.pap-p{padding:8px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:.72rem;font-weight:600;color:#64748b;cursor:pointer;background:#fff;transition:.2s}.sz-p:hover,.pap-p:hover{border-color:#6366f1}.sz-p.active,.pap-p.active{background:#6366f1;color:#fff;border-color:#6366f1}

/* Batch thumbs */
.slider-wrap{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;scrollbar-width:none;padding:4px}.slider-wrap::-webkit-scrollbar{display:none}.slide-item{flex:0 0 auto;cursor:pointer;text-align:center;transition:.2s}.slide-item img{width:60px;height:80px;object-fit:cover;border-radius:10px;border:2px solid #334155;transition:.2s}.slide-item.active img{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.3)}

/* Custom upload */
.cust-upload{border:2px dashed #cbd5e1;border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:.2s;background:#f8fafc;font-size:.72rem;color:#64748b}.cust-upload:hover{border-color:#6366f1;background:#eef2ff}
.cust-preview{display:flex;align-items:center;gap:10px;margin-top:8px}.cust-preview img{width:48px;height:48px;object-fit:cover;border-radius:8px;border:2px solid #6366f1}

/* Option section card */
.opt-card{background:#fff;border-radius:16px;border:1px solid rgba(255,255,255,.06);box-shadow:0 4px 16px rgba(0,0,0,.12);padding:16px;margin-bottom:12px}
.opt-card-title{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;color:#0f172a;margin-bottom:10px}
.opt-card-title .e{font-size:1rem}

.hidden{display:none!important}

/* Overlay */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.92);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s}.ov.show{opacity:1;pointer-events:auto}.sp{width:40px;height:40px;border:3px solid #334155;border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.ov .t{color:#fff;font-size:.95rem;font-weight:700;margin-top:16px}.ov .sub{color:#94a3b8;font-size:.72rem;margin-top:4px}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:12px;font-size:.78rem;font-weight:600;opacity:0;transition:.3s;z-index:600;pointer-events:none;white-space:nowrap;max-width:90vw}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.err{background:#dc2626}.toast.ok{background:#10b981}

/* Bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,.92);backdrop-filter:blur(12px);display:flex;z-index:300;padding:4px 0 max(4px,env(safe-area-inset-bottom,4px));height:56px}.bnav::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.45) 18%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.45) 82%,transparent 100%);pointer-events:none;z-index:1}.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#94a3b8;font-size:.6rem;font-weight:600;transition:.2s;-webkit-tap-highlight-color:transparent}.bnav a svg{width:20px;height:20px;stroke-width:1.8;fill:none;stroke:currentColor}.bnav a:hover{color:#a5b4fc}.bnav a.active{color:#818cf8}

.err-box{padding:12px 16px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;color:#dc2626;font-size:.75rem;margin-top:10px}
</style>
</head>
<body>
<div class="hdr"><div class="hdr-in">
  <div class="hdr-logo"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M7 20v-1a5 5 0 0110 0v1"/></svg></div>
  <div class="hdr-txt"><h1>Passport Photo Studio</h1><small>AI-powered ID photos in seconds</small></div>
  <div class="hdr-badge">⚡ ~$0.004</div>
</div></div>

<div class="page">

<!-- ══════ SECTION 1: UPLOAD ══════ -->
<!-- ══════ SECTION 2: POST-GENERATE (Preview + Options) ══════ -->
<div class="section" id="sec1">
  <div class="card" style="padding:24px">
    <div id="dropZone">
      <div class="drop" id="drop">
        <div class="ic">📷</div>
        <h3>Upload your photo</h3>
        <p>Drag &amp; drop or click to browse<br><small>JPG / PNG · Single or multiple (max 20)</small></p>
        <div class="drop-btns">
          <button class="btn-p" type="button" onclick="pickFile()">📁 Choose Photo</button>
        </div>
        <input type="file" id="fi" accept="image/jpeg,image/png" multiple>
      </div>
    </div>
  </div>
</div>


<div class="section hidden" id="sec3">
  <!-- Preview -->
  <div class="card hidden" id="previewCard" style="padding:20px;margin-bottom:12px">
    <div style="text-align:center;margin-bottom:10px">
      <div class="preview-box" id="previewBox"><div class="preview-bg" id="previewBg"></div><img class="preview-img" id="ri" src="" alt="Photo"></div>
    </div>
    <div id="batchPreview" class="hidden" style="margin:10px 0">
      <div class="slider-wrap" id="sliderWrap" style="justify-content:center"></div>
    </div>
    <div class="res-btns">
      <button class="btn-p hidden" id="btnDl" style="padding:9px 16px;font-size:.72rem" onclick="dl('passport')">⬇️ Download</button>
      <button class="btn-c hidden" id="btnDlT" style="padding:9px 16px;font-size:.72rem" onclick="dlTransparent()">💎 Transparent</button>
      <button class="btn-c" style="padding:9px 16px;font-size:.72rem" onclick="pickFile()">🔄 Change</button>
      <button class="btn-c" style="padding:9px 16px;font-size:.72rem" onclick="newPhoto()">🆕 New</button>
    </div>
    <div class="err-box hidden" id="upErr"></div>
  </div>

  <!-- Option tabs -->
  <div style="display:flex;gap:4px;margin-bottom:10px;background:#1e293b;border-radius:12px;padding:3px">
    <div class="opt-tab active" onclick="switchOptTab(0)">👔 เสื้อ</div>
    <div class="opt-tab" onclick="switchOptTab(1)">🎨 BG</div>
    <div class="opt-tab" onclick="switchOptTab(2)">📐 Size</div>
    <div class="opt-tab" onclick="switchOptTab(3)">🖨️ Print</div>
  </div>

  <!-- Tab 0: Clothing -->
  <div class="card opt-pane act" id="optPane0" style="padding:14px">
    <div class="opt-sec">
      <div class="gender-tabs" id="gt"></div>
      <div class="caro"><button class="carro-btn" onclick="scrollCar('cl',-1)">◀</button><div class="caro-list" id="cl"></div><button class="carro-btn" onclick="scrollCar('cl',1)">▶</button></div>
      <div id="custPreviewWrap" class="hidden" style="margin-top:8px">
        <div class="cust-preview">
          <img id="custPreviewImg" src="">
          <div><div id="custPreviewName" style="font-size:.7rem;font-weight:600"></div><button class="btn-c" style="padding:4px 10px;border:none;border-radius:6px;font-size:.6rem;cursor:pointer;margin-top:4px" onclick="removeCustomClothing()">✕ Remove</button></div>
        </div>
      </div>
    </div>
    <button class="gen-btn" id="genBtn" disabled onclick="generate()"><span class="ico">🚀</span> Generate</button>
    <button class="gen-btn hidden" id="genAllBtn" onclick="generateAll()" style="background:#059669;margin-top:8px"><span class="ico">⚡</span> Generate ทั้งหมด (batch)</button>
  </div>

  <!-- Tab 1: Background -->
  <div class="card opt-pane" id="optPane1" style="padding:14px">
    <div id="bgPresets" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"></div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
      <input type="color" id="bgColorPick" value="#C4DCFF" style="width:32px;height:26px;border:1px solid #cbd5e1;border-radius:6px;padding:0;cursor:pointer">
      <span style="font-size:.65rem;color:#64748b">Custom</span>
      <button class="btn-p" style="padding:7px 14px;font-size:.7rem;margin-left:auto" onclick="applyBG()">✂️ Apply BG</button>
    </div>
  </div>

  <!-- Tab 2: Size (Country + Photo Size) -->
  <div class="card opt-pane" id="optPane2" style="padding:14px">
    <div style="margin-bottom:10px"><label style="font-size:.65rem;font-weight:600;color:#64748b;display:block;margin-bottom:4px">🌍 Country</label><select id="cs" style="width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:.78rem;background:#fff;color:#0f172a;outline:none"></select></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      <div class="sz-p active" onclick="setCustomSize(35,45,this)">35×45mm</div>
      <div class="sz-p" onclick="setCustomSize(25,35,this)">25×35mm</div>
      <div class="sz-p" onclick="setCustomSize(33,48,this)">33×48mm</div>
      <div class="sz-p" onclick="setCustomSize(51,51,this)">51×51mm</div>
      <div class="sz-p" onclick="setCustomSize(38,50,this)">38×50mm</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <input type="number" id="customW" value="35" min="10" max="200" style="flex:1;padding:7px 8px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.72rem;text-align:center;outline:none">
      <span style="color:#94a3b8;font-weight:600">×</span>
      <input type="number" id="customH" value="45" min="10" max="200" style="flex:1;padding:7px 8px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.72rem;text-align:center;outline:none">
      <span style="font-size:.6rem;color:#94a3b8">mm</span>
      <button class="btn-p" style="padding:7px 12px;font-size:.68rem" onclick="applySize()">📐 Apply</button>
    </div>
  </div>

  <!-- Tab 3: Print -->
  <div class="card opt-pane" id="optPane3" style="padding:14px">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
      <div class="pap-p active" onclick="setPaper('4x6',this)">4×6"</div>
      <div class="pap-p" onclick="setPaper('5x7',this)">5×7"</div>
      <div class="pap-p" onclick="setPaper('a6',this)">A6</div>
      <div class="pap-p" onclick="setPaper('a4',this)">A4</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <div style="flex:1"><label style="font-size:.6rem;font-weight:600;color:#94a3b8;display:block;margin-bottom:3px">Count</label><input type="number" id="customCount" value="6" min="1" max="200" style="width:100%;padding:7px 8px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.68rem;text-align:center;outline:none"></div>
      <div style="flex:1"><label style="font-size:.6rem;font-weight:600;color:#94a3b8;display:block;margin-bottom:3px">Border</label><input type="number" id="bwmmPrint" value="0" min="0" max="20" step="0.5" style="width:100%;padding:7px 8px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.68rem;text-align:center;outline:none"></div>
      <div style="flex:0;display:flex;align-items:flex-end;padding-bottom:2px"><label style="display:flex;align-items:center;gap:3px;font-size:.6rem;font-weight:600;color:#94a3b8;cursor:pointer"><input type="checkbox" id="bmPrint" style="accent-color:#6366f1;width:13px;height:13px"> Blade</label></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:10px;padding:8px 10px;background:#f1f5f9;border-radius:8px">
      <label style="font-size:.72rem;color:#334155;display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="mpPrint" checked> รวมทุกรูปในแผ่นเดียว (<span id="poolN">0</span>)
      </label>
      <span style="margin-left:auto;font-size:.72rem;color:#334155;display:flex;align-items:center;gap:4px">
        ซ้ำ/รูป <input type="number" id="cpPrint" min="1" max="10" value="2" style="width:44px">
      </span>
    </div>
    <button class="btn-p" style="width:100%;padding:9px;font-size:.72rem" onclick="genPrintSheet()">🖨️ Generate Print Sheet</button>
  </div>
</div>


</div><!-- .page -->

<div class="ov" id="ov"><div class="sp"></div><div class="t" id="ovt">Generating...</div><div class="sub" id="ovs"></div></div>
<div class="toast" id="toast"></div>

<div class="bnav"><a href="/" class="active"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>Home</a><a href="/gallery.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Gallery</a><a href="/print.html"><svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print</a></div>

<script src="app.js"></script>
</body>
</html>
