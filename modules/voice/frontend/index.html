<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice POS - สั่งอาหารด้วยเสียง</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Voice POS">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#667eea">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      padding-bottom: 100px; /* space for cart bar */
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 { font-size: 28px; margin-bottom: 10px; }
    .header p { opacity: 0.9; font-size: 14px; }

    .chat-area {
      height: 400px;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fa;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
      align-items: flex-start;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .message-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
    }

    .message.ai .message-bubble {
      background: white;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .message.user .message-bubble {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      margin: 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .message.ai .message-avatar { background: #e3f2fd; }
    .message.user .message-avatar { background: #f3e5f5; }

    .controls {
      padding: 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-mic {
      flex: 1;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-mic:hover { transform: scale(1.02); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
    .btn-mic:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-mic.recording {
      background: linear-gradient(135deg, #f44336 0%, #e91e63 100%);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .btn-clear {
      padding: 15px;
      background: #f5f5f5;
      color: #666;
    }

    .btn-clear:hover { background: #e0e0e0; }

    .status {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }

    .status.listening { color: #f44336; font-weight: 600; }
    .status.processing { color: #667eea; font-weight: 600; }

    /* === Cart Bar (sticky bottom) === */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      transition: transform 0.3s;
      transform: translateY(100%);
    }

    .cart-bar.visible {
      transform: translateY(0);
    }

    .cart-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cart-icon {
      font-size: 24px;
      position: relative;
    }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #f44336;
      color: white;
      font-size: 11px;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-total {
      font-size: 14px;
      color: #333;
    }

    .cart-total strong {
      font-size: 18px;
      color: #e65100;
    }

    .btn-send-kitchen {
      padding: 12px 24px;
      background: linear-gradient(135deg, #ff9800 0%, #f44336 100%);
      color: white;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 12px;
    }

    .btn-send-kitchen:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(244, 67, 54, 0.4);
    }

    .btn-send-kitchen:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* === Confirmation Popup === */
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .popup-overlay.show {
      display: flex;
    }

    .popup-modal {
      background: white;
      border-radius: 20px;
      max-width: 400px;
      width: 100%;
      overflow: hidden;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .popup-header {
      background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .popup-header .emoji { font-size: 40px; display: block; margin-bottom: 10px; }
    .popup-header h2 { font-size: 20px; }

    .popup-body {
      padding: 20px;
    }

    .popup-item {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .popup-item:last-child { margin-bottom: 0; }

    .popup-item-name {
      font-size: 18px;
      font-weight: 700;
      color: #333;
    }

    .popup-item-name-en {
      font-size: 13px;
      color: #999;
      margin-top: 2px;
    }

    .popup-item-detail {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .popup-item-qty {
      font-size: 14px;
      color: #666;
    }

    .popup-item-price {
      font-size: 20px;
      font-weight: 700;
      color: #e65100;
    }

    .popup-footer {
      padding: 0 20px 20px;
      display: flex;
      gap: 10px;
    }

    .popup-footer button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
    }

    .btn-add-cart {
      background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
      color: white;
    }

    .btn-add-cart:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
    }

    .btn-skip {
      background: #f5f5f5;
      color: #666;
    }

    .btn-skip:hover { background: #e0e0e0; }

    /* === Order summary in chat area === */
    .order-summary {
      background: #fff3e0;
      border: 2px solid #ff9800;
      border-radius: 10px;
      padding: 15px;
      margin-top: 10px;
    }

    .order-summary h3 {
      color: #e65100;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 14px;
    }

    .order-total {
      border-top: 2px solid #ff9800;
      margin-top: 10px;
      padding-top: 10px;
      font-weight: 700;
      font-size: 18px;
      color: #e65100;
    }

    /* Cancel item button on order summary */
    .btn-remove-item {
      background: none;
      border: none;
      color: #f44336;
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
    }

    .btn-remove-item:hover { font-weight: 700; }

    /* Spinner for processing */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(102, 126, 234, 0.3);
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎤 Voice POS</h1>
      <p>สั่งอาหารด้วยเสียง - พูดแล้วกดยืนยัน</p>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="message ai">
        <div class="message-avatar">🤖</div>
        <div class="message-bubble">
          สวัสดีครับ! ยินดีต้อนรับสู่ร้านอาหารไทย 🍜<br>
          กดไมค์แล้วพูดชื่อเมนูที่ต้องการได้เลยครับ
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="button-group">
        <button class="btn-mic" id="micBtn">🎤 กดเพื่อพูด</button>
        <button class="btn-clear" id="clearBtn">🗑️ ล้าง</button>
      </div>
      <div class="status" id="status">พร้อมรับคำสั่ง</div>
    </div>
  </div>

  <!-- Confirmation Popup -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-modal">
      <div class="popup-header">
        <span class="emoji">🍽️</span>
        <h2>เจอรายการนี้ใช่มั้ยครับ?</h2>
      </div>
      <div class="popup-body" id="popupBody">
        <!-- Items rendered by JS -->
      </div>
      <div class="popup-footer">
        <button class="btn-skip" id="btnSkip">❌ ไม่ใช่</button>
        <button class="btn-add-cart" id="btnAddCart">✅ เพิ่มในตะกร้า</button>
      </div>
    </div>
  </div>

  <!-- Cart Bar -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-info">
      <div class="cart-icon">
        🛒
        <span class="cart-count" id="cartCount">0</span>
      </div>
      <div class="cart-total">
        รวม: <strong id="cartTotal">0</strong> บาท
      </div>
    </div>
    <button class="btn-send-kitchen" id="btnSendKitchen">
      🍳 ส่งไปครัว
    </button>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
