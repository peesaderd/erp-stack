# nginx configuration for openhands.m2igen.com

server {
    listen 80;
    server_name _;  # catch‑all

    # Frontend (React) – serve static files and fallback to index.html
    location / {
        # Try to serve the requested file, fallback to index.html for SPA routing
        try_files $uri $uri/ /index.html;
        # proxy_pass only if file not found (handled by fallback)
        # Note: static files are served directly by nginx from the mounted volume
    }

    # Backend API – Node/Express (port 4000 inside container)
    location /api/ {
        proxy_pass http://host.docker.internal:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Existing TikTok gateway proxy (preserve for compatibility)
    location /tiktok/ {
        proxy_pass http://gateway:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve product images statically from server folder
    location /product_images/ {
        alias /usr/share/nginx/html/product_images/;
        autoindex on;
    }
}
